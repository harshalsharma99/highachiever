name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/high-achievers-website-u0zixc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # GitHub Pages only serves static files with no server-side rewrites, so a
      # deep link (e.g. /curricula/cbse) 404s on first load. Copying index.html
      # to 404.html makes Pages fall back to it, and React Router (BrowserRouter)
      # then reads the real URL and renders the right page client-side.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
